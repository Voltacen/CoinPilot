{% extends "base.html" %}
{% block title %}Register Account — CoinPilot{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
    <div class="card">
        <div class="card-header">
            <h2 style="font-size: 1.25rem; font-weight: 700;">Register Account</h2>
            <span class="badge badge-testnet">System Access</span>
        </div>
        <form method="POST" action="{{ url_for('auth_views.register') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="user@domain.internal" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password (Minimum 8 Characters)</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••••••" minlength="8" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••••••" minlength="8" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Create Account</button>
        </form>
        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-muted);">
            Already have an account? <a href="{{ url_for('auth_views.login') }}">Login</a>
        </div>
    </div>
</div>
{% endblock %}
