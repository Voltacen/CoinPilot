version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: coinpilot
      POSTGRES_USER: coinpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coinpilot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - 5432

  redis:
    image: redis:7
    ports:
      - 6379:6379

  web:
    build: ./backend
    env_file: ./.env
    depends_on:
      - db
      - redis
    ports:
      - 5000:5000
    volumes:
      - ./backend:/app

  worker:
    build: ./backend
    env_file: ./.env
    command: celery -A backend.celery_worker.celery worker --loglevel=info
    depends_on:
      - web
      - redis
    volumes:
      - ./backend:/app

  playwright:
    image: mcr.microsoft.com/playwright:focal
    volumes:
      - ./backend:/app
    depends_on:
      - web

  frontend:
    build: ./frontend
    env_file: ./.env
    ports:
      - 3000:3000
    volumes:
      - ./frontend:/app

volumes:
  pgdata:
