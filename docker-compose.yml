version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: coinpilot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: coinpilot_db
      POSTGRES_USER: coinpilot_user
      POSTGRES_PASSWORD: secure_pg_password_change_in_prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coinpilot_user -d coinpilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: coinpilot_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://coinpilot_user:secure_pg_password_change_in_prod@db:5432/coinpilot_db
    ports:
      - "8000:8000"

  nginx:
    image: nginx:alpine
    container_name: coinpilot_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  pgdata:
