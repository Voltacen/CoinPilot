services:
  web:
    container_name: coinpilot-web
    build:
      context: .
      args:
        PYTHON_VERSION: "3.12"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8000"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    container_name: coinpilot-nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  db:
    container_name: coinpilot-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: coinpilot
      POSTGRES_USER: coinpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coinpilot -d coinpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
